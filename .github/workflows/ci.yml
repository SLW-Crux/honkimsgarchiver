# Lean CI — change-triggered + quarterly. Runs on push/PR (code regressions)
# and on workflow_dispatch (the quarterly drift run fired from
# ops-central/quarterly-ci.yml). No scheduled reruns: unchanged code can only
# differ on environment drift, which the quarterly run covers.
# secret-scan (gitleaks) is free for personal-account repos.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
